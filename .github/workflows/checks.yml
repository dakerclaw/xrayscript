name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: i18n / syntax / json checks
        run: bash .github/scripts/check.sh

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -S error -e SC1090,SC1091,SC2016 \
            install.sh core/*.sh service/*.sh tool/*.sh
